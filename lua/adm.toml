# adm.toml
#
# The publisher section is missing: run `adm app init --publisher admlang` in
# this folder before building the library for publication.

schema = 1

# What ships beside the sources: the engine's C, compiled into every program
# that uses the library.
[[package.files]]
from = "lua/lua-amalgam.c"
to = "lua/lua-amalgam.c"

[[package.files]]
from = "lua/adm_lua.c"
to = "lua/adm_lua.c"

[[package.files]]
from = "lua/lua.h"
to = "lua/lua.h"

[[package.files]]
from = "lua/luaconf.h"
to = "lua/luaconf.h"

[[package.files]]
from = "lua/lualib.h"
to = "lua/lualib.h"

[[package.files]]
from = "lua/lauxlib.h"
to = "lua/lauxlib.h"

[[package.files]]
from = "lua/LICENSE"
to = "lua/LICENSE"

