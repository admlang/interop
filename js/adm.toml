# adm.toml
#
# Optional manifest for application identity, updates, and packaging.
# If this file is missing, identity/update builtins are empty strings.
#
# Generated by `adm app init` at: 2026-10-04T18:30:55Z
# The private key lives outside the repository (adm app init printed where).
# Keep it secret; never commit it.
# Derived publisher id: admpub_6o5bluqytd5ygnvhsjvppxaigoqqu6qh5ljixetzihnaide3u33a
#
# Identity derivation (current):
# - publisher_id = base32(sha256(pubkey_bytes))
# - app_id      = base32(sha256(pubkey_bytes + ":" + repo_salt + ":" + app_slug_or_app_name))
#

schema = 1

[publisher]
# Ed25519 public key (base64). Used for update verification and id derivation.
pubkey = "ed25519:base64:ZcfhD3m1jmc/pabbwU8U1XL8wQxCBia6+HCVV14aq50="

# Random per-repo salt (base64). Keeps app ids stable across renames.
repo_salt = "base64:SUD+IUE18EmR69hVtX9Pq5oQVqTRjM10t0YrZ9kh30I="

# Optional publisher display name (not used for identity).
name = "ADM Lang"

[update]
# Optional global update defaults (per-app overrides can replace these).
# feed = "https://updates.example.com/your/repo/feed.json"
# channel = "stable"
# artifact = "bundle"  # e.g. "bundle" | "exe"

# Per-application overrides (keyed by ADM `application` name).
#
# [apps."MainApp"]
# # Optional stable slug used for app_id derivation; defaults to the application name.
# slug = "main"
# # Optional application version used by update feeds and metadata.
# # version = "1.0.0"
#
# [apps."MainApp".update]
# # feed = "https://updates.example.com/your/repo/main/feed.json"
# # channel = "stable"
# # artifact = "bundle"
#
# [apps."MainApp".package]
# # Packaging manifest consumed by `adm package build`.
# format = "tar.gz"
# install_root = "user"   # planned for installer
# bin_link = "main"       # planned for installer
#
# [[apps."MainApp".package.files]]
# from = "build/main"
# to = "bin/main"
# mode = "0755"
#
# [[apps."MainApp".package.files]]
# from = "assets/"
# to = "assets/"

# What ships beside the sources: the engine's C, compiled into every program
# that uses the library.
[[package.files]]
from = "quickjs/quickjs-amalgam.c"
to = "quickjs/quickjs-amalgam.c"

[[package.files]]
from = "quickjs/quickjs.h"
to = "quickjs/quickjs.h"

[[package.files]]
from = "quickjs/adm_qjs.c"
to = "quickjs/adm_qjs.c"

[[package.files]]
from = "quickjs/LICENSE"
to = "quickjs/LICENSE"
