# adm.toml
#
# The publisher section is missing: run `adm app init --publisher admlang` in
# this folder before building the library for publication.

schema = 1

# What ships beside the sources: the engine's C, compiled into every program
# that uses the library.
[[package.files]]
from = "micropython/micropython-amalgam.c"
to = "micropython/micropython-amalgam.c"

[[package.files]]
from = "micropython/adm_mpy.c"
to = "micropython/adm_mpy.c"

[[package.files]]
from = "micropython/micropython.h"
to = "micropython/micropython.h"

[[package.files]]
from = "micropython/LICENSE"
to = "micropython/LICENSE"

[publisher]
pubkey = "ed25519:base64:ZcfhD3m1jmc/pabbwU8U1XL8wQxCBia6+HCVV14aq50="
repo_salt = "base64:bKXJ20iC6ER7B3KOvVLgvlJyLiBeajvVy9GxOsuXKkI="

# The line `adm search` shows for the library; `adm publish` files it.
[apps."adm.interop.python"]
description = "Python interop library"
